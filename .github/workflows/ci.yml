name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Go tests
        working-directory: packages/go
        run: go test -v -race -cover ./...

  test-ts:
    name: TypeScript Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/ts/package-lock.json

      - name: Install dependencies
        working-directory: packages/ts
        run: npm ci

      - name: Run Vitest
        working-directory: packages/ts
        run: npm test

      - name: Build package
        working-directory: packages/ts
        run: npm run build

  test-csharp:
    name: C# (.NET) Tests & Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore & Test
        working-directory: packages/csharp
        run: dotnet test Clutils.sln --configuration Release

      - name: Pack NuGet package
        working-directory: packages/csharp
        run: dotnet pack src/Clutils/Clutils.csproj --configuration Release --no-build
